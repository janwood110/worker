name: Correct scientific math notation
on:
  push:
    branches: [main]
    paths:
      - "scripts/repair-scientific-math.mjs"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing scientific renderer dependencies
        run: npm install --prefix /tmp/nobari-science-render --no-audit --no-fund marked@17.0.5 katex@0.19.0
      - name: Correct only the verified existing scientific Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "47d4f4cea147d22cff242df8b0f44117"
        run: node scripts/repair-scientific-math.mjs
      - name: Save protected-field verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/wp-depth/verification/worker-math-correction.json
          git commit -m "Record verified mathematical notation repair"
          git pull --rebase origin main
          git push origin main
