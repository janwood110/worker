name: Prepare scientific WordPress article bodies
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-wordpress-depth.mjs'
      - 'deploy/wp-depth/targets.json'
      - 'deploy/wp-depth/custom.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render and validate scientific body additions
        run: |
          npm install --prefix /tmp/nobari-science-render --no-audit --no-fund marked@17.0.5 katex@0.19.0
          node scripts/prepare-wordpress-depth.mjs
      - name: Preserve prepared content for direct WordPress publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/wp-depth/prepared
          git diff --cached --quiet && exit 0
          git commit -m 'Prepare reviewed scientific body additions for WordPress'
          git push origin HEAD:main
